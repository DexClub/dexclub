plugins {
    id("java")
    id("org.jetbrains.kotlin.jvm")
    id("application")
}

group = "org.luckypray"
version = "1.0-SNAPSHOT"

def library = "${layout.buildDirectory.file("library").get().asFile}"
def args = ["-Djava.library.path=$library"]

application {
    applicationDefaultJvmArgs += args
    mainClass.set("MainKt")
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

dependencies {
    implementation(project(":dexkit"))
}


afterEvaluate {
    tasks.register("cmakeBuild", Copy) {
        group = "build"
        dependsOn(project(":dexkit").tasks.named("cmakeBuild"))
        from(project(":dexkit").layout.buildDirectory.dir("cmake"))
        into(layout.buildDirectory.dir("library"))
        include("**/*.so", "**/*.dll", "**/*.dylib")
        eachFile {
            path = name
        }
        includeEmptyDirs = false
    }
    tasks.jar.dependsOn(tasks.cmakeBuild)
    tasks.run.dependsOn(tasks.jar)
}

evaluationDependsOn(":dexkit")
